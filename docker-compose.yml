services:
  postgres:
    image: postgres:17
    container_name: linkpack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: LinkPack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - linkpack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LinkPack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  linkpack-postgres-data: